<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#16a34a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Mi Entreno" />
<link rel="manifest" href="manifest.webmanifest" />
<title>Mi Entreno</title>
<style>
:root{--p:#16a34a;--p2:#22c55e;--bg:#f0fdf4;--card:#fff;--txt:#0f172a;--sub:#64748b;--line:#e2e8f0;--bad:#dc2626;--r:18px}
@media (prefers-color-scheme:dark){:root{--bg:#06150c;--card:#0f1f16;--txt:#e5e7eb;--sub:#94a3b8;--line:#1e3a2a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);padding-bottom:calc(88px + env(safe-area-inset-bottom))}
header{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;padding:18px 18px 22px;border-radius:0 0 26px 26px}
header h1{margin:0;font-size:22px}
header p{margin:4px 0 0;opacity:.9;font-size:14px;text-transform:capitalize}
main{padding:16px}
.vista{display:none}.vista.activa{display:block}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card h3{margin:0 0 12px;font-size:16px}
.destacado{background:linear-gradient(135deg,#14532d,var(--p));color:#fff}
.destacado small{opacity:.85}
.stat{font-size:26px;font-weight:700;margin:4px 0 10px}
.barra{height:10px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden}
.barra div{height:100%;background:#fff;width:0;transition:width .4s}
.rhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.rhead b{display:block}
.rhead small{color:var(--sub)}
.hecha{opacity:.7}
.minis-row{display:flex;gap:6px;overflow-x:auto;margin:10px 0 4px;padding-bottom:2px}
.minis-row>div{flex:none}
details{margin-top:6px;font-size:14px}
details summary{color:var(--p);cursor:pointer}
.acciones{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn{width:100%;padding:13px;border:0;border-radius:14px;background:var(--p);color:#fff;font-size:16px;font-weight:600;margin:4px 0;font-family:inherit}
.btn.sec{background:var(--bg);color:var(--txt);border:1px solid var(--line)}
.btn.peligro{background:var(--bad)}
.btn.sm{width:auto;padding:8px 12px;font-size:14px;margin:0;flex:none}
.btn:disabled{opacity:.6}
input,textarea,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--txt);font-size:16px;margin-bottom:12px;font-family:inherit}
textarea{min-height:90px;resize:vertical}
label{font-size:13px;color:var(--sub);display:block;margin:2px 0 4px}
.dias{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.dias label{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:7px 10px;color:var(--txt);font-size:14px;margin:0;cursor:pointer}
.dias input{width:auto;margin:0}
.builder{display:grid;grid-template-columns:2fr 1fr 1fr;gap:6px;margin-bottom:8px}
.builder input,.builder select{margin:0;padding:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.mini{background:var(--card);border-radius:var(--r);padding:12px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.mini b{display:block;font-size:22px;color:var(--p)}
.mini small{color:var(--sub);font-size:12px}
.grafico{display:flex;align-items:flex-end;gap:6px;height:140px;padding-top:8px}
.grafico div{flex:1;background:linear-gradient(var(--p2),var(--p));border-radius:8px 8px 3px 3px;min-height:4px;position:relative}
.grafico span{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--sub);white-space:nowrap}
.lista{list-style:none;padding:0;margin:0}
.fila{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;cursor:pointer}
.fila:last-child{border-bottom:0}
.fila .txt{flex:1;min-width:0}
.fila small{color:var(--sub)}
.vacio{text-align:center;color:var(--sub);padding:18px 0;font-size:14px;list-style:none}
/* Miniaturas de ejercicios */
.thumb{width:56px;height:56px;border-radius:14px;background:var(--bg);display:grid;place-items:center;flex:none;overflow:hidden;color:var(--p)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb svg{width:44px;height:44px}
.minis-row .thumb{width:48px;height:48px;border-radius:12px}
.minis-row .thumb svg{width:36px;height:36px}
.grid-ej{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ej-card{background:var(--card);border:0;border-radius:var(--r);padding:10px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.06);color:var(--txt);font-family:inherit;cursor:pointer}
.ej-card .thumb{width:100%;height:110px;border-radius:14px}
.ej-card .thumb svg{width:86px;height:86px}
.ej-card b{display:block;margin-top:8px;font-size:14px}
.ej-card small{color:var(--sub)}
.preview{width:100%;height:230px;border-radius:18px;background:var(--bg);display:grid;place-items:center;overflow:hidden;color:var(--p);margin-bottom:12px}
.preview img{width:100%;height:100%;object-fit:contain}
.preview svg{width:190px;height:190px}
.sw{position:relative;width:48px;height:28px;flex:none}
.sw input{opacity:0;width:0;height:0;margin:0}
.sw span{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.2s}
.sw span::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked + span{background:var(--p)}
.sw input:checked + span::after{transform:translateX(20px)}
nav.bottom{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:10}
nav.bottom button{background:none;border:0;color:var(--sub);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit;padding:4px}
nav.bottom button i{font-style:normal;font-size:20px}
nav.bottom button.on{color:var(--p);font-weight:600}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.overlay.abierto{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sheet-head h2{margin:0;font-size:18px}
.x{background:var(--bg);border:0;border-radius:50%;width:34px;height:34px;color:var(--txt);font-size:16px;flex:none}
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:30;max-width:90%;text-align:center}
.toast.on{opacity:1}
</style>
</head>
<body>

<header>
  <h1>💪 Mi Entreno</h1>
  <p id="fechaHoy"></p>
</header>

<main>
  <!-- HOY -->
  <section class="vista activa" id="v-hoy">
    <div class="card destacado">
      <small>Progreso de hoy</small>
      <div class="stat" id="resumenHoy">0 de 0 rutinas</div>
      <div class="barra"><div id="barraHoy"></div></div>
    </div>
    <div id="listaHoy"></div>
  </section>

  <!-- RUTINAS -->
  <section class="vista" id="v-rutinas">
    <button class="btn" id="btnNuevaRutina">+ Nueva rutina</button>
    <div id="listaRutinas"></div>

    <div class="card">
      <h3>📚 Biblioteca de ejercicios</h3>
      <div class="grid-ej" id="biblioteca"></div>
    </div>
  </section>

  <!-- PROGRESO -->
  <section class="vista" id="v-progreso">
    <div class="grid3">
      <div class="mini"><b id="pRacha">0</b><small>días de racha</small></div>
      <div class="mini"><b id="pSemana">0</b><small>últimos 7 días</small></div>
      <div class="mini"><b id="pTotal">0</b><small>en total</small></div>
    </div>
    <div class="card">
      <h3>Últimos 14 días</h3>
      <div class="grafico" id="grafico"></div>
      <div style="height:22px"></div>
    </div>
    <div class="card">
      <h3>Historial reciente</h3>
      <ul class="lista" id="historial"></ul>
    </div>
  </section>

  <!-- AVISOS -->
  <section class="vista" id="v-avisos">
    <div class="card">
      <h3>🔔 Notificaciones</h3>
      <p id="estadoPerm" style="margin:0 0 12px;color:var(--sub);font-size:14px"></p>
      <button class="btn" id="btnPermiso">Activar avisos</button>
      <button class="btn sec" id="btnPrueba">Enviar aviso de prueba</button>
    </div>

    <div class="card">
      <h3>➕ Nuevo recordatorio</h3>
      <label for="aHora">Hora</label>
      <input type="time" id="aHora" value="07:00" />
      <label>Días</label>
      <div class="dias" id="aDias"></div>
      <label for="aMensaje">Mensaje</label>
      <input type="text" id="aMensaje" maxlength="80" placeholder="Hora de entrenar 💪" />
      <button class="btn" id="btnGuardarAviso">Guardar recordatorio</button>
    </div>

    <div class="card">
      <h3>Mis recordatorios</h3>
      <ul class="lista" id="listaAvisos"></ul>
    </div>
  </section>
</main>

<nav class="bottom">
  <button data-vista="v-hoy" class="on"><i>🏠</i>Hoy</button>
  <button data-vista="v-rutinas"><i>📋</i>Rutinas</button>
  <button data-vista="v-progreso"><i>📈</i>Progreso</button>
  <button data-vista="v-avisos"><i>🔔</i>Avisos</button>
</nav>

<!-- MODAL RUTINA -->
<div class="overlay" id="ovRutina">
  <div class="sheet">
    <div class="sheet-head"><h2 id="rTitulo">Nueva rutina</h2><button class="x" data-cerrar="ovRutina">✕</button></div>
    <label for="rNombre">Nombre</label>
    <input type="text" id="rNombre" maxlength="60" placeholder="Ej: Piernas y glúteos" />

    <label>Ejercicios de la rutina</label>
    <ul class="lista" id="bItems" style="margin-bottom:10px"></ul>

    <label>Agregar ejercicio de la biblioteca</label>
    <div class="builder">
      <select id="bEj"></select>
      <input type="number" id="bSeries" min="1" max="10" value="3" aria-label="Series" />
      <input type="text" id="bReps" value="10" maxlength="20" aria-label="Repeticiones" />
    </div>
    <button class="btn sec" id="bAgregar">+ Agregar</button>

    <label for="bTexto" style="margin-top:12px">O escribe uno libre</label>
    <div class="builder" style="grid-template-columns:1fr auto">
      <input type="text" id="bTexto" maxlength="60" placeholder="Ej: Estiramiento de cuello" />
      <button class="btn sm sec" id="bLibre">Agregar</button>
    </div>

    <button class="btn" id="rGuardar" style="margin-top:10px">Guardar rutina</button>
    <button class="btn peligro" id="rBorrar" hidden>Eliminar rutina</button>
  </div>
</div>

<!-- MODAL EJERCICIO -->
<div class="overlay" id="ovEjercicio">
  <div class="sheet">
    <div class="sheet-head"><h2 id="eTitulo">Ejercicio</h2><button class="x" data-cerrar="ovEjercicio">✕</button></div>
    <div class="preview" id="ePreview"></div>
    <div id="eInfo"></div>
    <input type="file" id="eFile" accept="image/*" hidden />
    <button class="btn sec" id="eSubir" style="margin-top:12px">📷 Subir mi foto de este ejercicio</button>
    <button class="btn sec" id="eQuitarFoto" hidden>Quitar mi foto</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ===================== CATÁLOGO ===================== */
// Ilustraciones simplificadas (pictogramas) creadas para esta app.
const POSES = {
  pie:        { cabeza: [60, 18], lineas: [[[60,30],[60,68]], [[60,38],[44,56],[42,72]], [[60,38],[76,56],[78,72]], [[60,68],[54,90],[54,110]], [[60,68],[66,90],[66,110]]] },
  sentadilla: { cabeza: [60, 30], lineas: [[[60,42],[56,72]], [[60,48],[86,50]], [[56,72],[40,90],[46,110]], [[56,72],[72,90],[68,110]]] },
  zancada:    { cabeza: [60, 22], lineas: [[[60,34],[58,68]], [[60,42],[44,58],[40,72]], [[60,42],[76,58],[80,72]], [[58,68],[44,88],[44,110]], [[58,68],[76,88],[92,110]]] },
  flexion:    { cabeza: [34, 50], lineas: [[[44,62],[104,78],[108,104]], [[44,62],[44,106]]] },
  plancha:    { cabeza: [24, 62], lineas: [[[36,70],[104,80]], [[38,70],[36,104]]] },
  puente:     { cabeza: [24, 94], lineas: [[[38,96],[68,62],[90,80],[100,104]]] },
  abdominal:  { cabeza: [36, 80], lineas: [[[46,90],[78,100]], [[78,100],[96,78],[100,104]]] }
};

const EJERCICIOS = [
  { id: "sentadilla", nombre: "Sentadilla", grupo: "Piernas", nivel: "Principiante", pose: "sentadilla",
    como: "Pies a la anchura de los hombros. Baja doblando rodillas y caderas como si te sentaras, con la espalda recta. Sube empujando el suelo con los talones." },
  { id: "zancada", nombre: "Zancada alterna", grupo: "Piernas", nivel: "Intermedio", pose: "zancada",
    como: "Da un paso largo al frente y baja hasta que ambas rodillas queden cerca de los 90°. Vuelve a la posición inicial y alterna la pierna." },
  { id: "puente", nombre: "Puente de glúteo", grupo: "Glúteos", nivel: "Principiante", pose: "puente",
    como: "Tumbado boca arriba, rodillas flexionadas y pies apoyados. Sube la cadera apretando los glúteos y baja controlando el movimiento." },
  { id: "talones", nombre: "Elevación de talones", grupo: "Piernas", nivel: "Principiante", pose: "pie",
    como: "De pie, sube sobre la punta de los pies y baja despacio. Puedes apoyarte en una pared para mantener el equilibrio." },
  { id: "flexiones", nombre: "Flexiones", grupo: "Pecho y brazos", nivel: "Intermedio", pose: "flexion",
    como: "Manos un poco más anchas que los hombros. Baja el pecho sin arquear la espalda y sube empujando. Si cuesta, apóyate sobre las rodillas." },
  { id: "plancha", nombre: "Plancha", grupo: "Core", nivel: "Principiante", pose: "plancha",
    como: "Apóyate en los antebrazos y las puntas de los pies. Cuerpo en línea recta de la cabeza a los talones, sin hundir la cadera." },
  { id: "abdominales", nombre: "Abdominales", grupo: "Core", nivel: "Principiante", pose: "abdominal",
    como: "Tumbado con las rodillas flexionadas, eleva los hombros del suelo contrayendo el abdomen. No jales el cuello con las manos." },
  { id: "jumping", nombre: "Jumping jacks", grupo: "Cardio", nivel: "Principiante", pose: "pie",
    como: "Salta abriendo las piernas y levantando los brazos a la vez; vuelve a la posición inicial. Mantén un ritmo constante." },
  { id: "sentadillaSalto", nombre: "Sentadilla con salto", grupo: "Cardio", nivel: "Avanzado", pose: "sentadilla",
    como: "Haz una sentadilla y al subir salta con fuerza. Aterriza suave doblando las rodillas." },
  { id: "marcha", nombre: "Marcha en el sitio", grupo: "Cardio", nivel: "Principiante", pose: "pie",
    como: "Camina en el sitio levantando las rodillas y moviendo los brazos. Es ideal para calentar." }
];
const EJ = Object.fromEntries(EJERCICIOS.map(e => [e.id, e]));

const PRESETS = [
  { nombre: "Cuerpo completo (principiante)", items: [
    { ej: "sentadilla", series: 3, reps: "10" }, { ej: "flexiones", series: 3, reps: "8" },
    { ej: "puente", series: 3, reps: "12" }, { ej: "plancha", series: 3, reps: "20 s" },
    { ej: "abdominales", series: 3, reps: "12" } ] },
  { nombre: "Piernas y glúteos", items: [
    { ej: "sentadilla", series: 4, reps: "12" }, { ej: "zancada", series: 3, reps: "10 por pierna" },
    { ej: "puente", series: 3, reps: "15" }, { ej: "talones", series: 3, reps: "20" } ] },
  { nombre: "Cardio en casa", items: [
    { ej: "jumping", series: 3, reps: "40 s" }, { ej: "marcha", series: 3, reps: "60 s" },
    { ej: "sentadillaSalto", series: 3, reps: "8" } ] }
];

/* ===================== DATOS ===================== */
const KEY = "miEntreno.v2";
const KEY_VIEJO = "miEntreno.v1";
const DIAS = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const hoyStr = (d = new Date()) => new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);

function cargar() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY) || "null");
    if (d) return d;
    const viejo = JSON.parse(localStorage.getItem(KEY_VIEJO) || "null");
    if (viejo) {
      // Migra la versión anterior: sus ejercicios pasan a ser texto libre.
      return {
        rutinas: (viejo.rutinas || []).map(r => ({ id: r.id, nombre: r.nombre, items: (r.ejercicios || []).map(t => ({ texto: t })) })),
        sesiones: viejo.sesiones || [],
        recordatorios: viejo.recordatorios || []
      };
    }
  } catch {}
  // Primera vez: rutinas de ejemplo.
  return {
    rutinas: PRESETS.map(p => ({ id: uid(), nombre: p.nombre, items: p.items.map(i => ({ ...i })) })),
    sesiones: [],
    recordatorios: []
  };
}
let db = cargar();
const guardar = () => localStorage.setItem(KEY, JSON.stringify(db));
let rutinaEditId = null;
let tmpItems = [];
let ejActual = null;

function toast(msg) {
  const t = $("#toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), 2500);
}
const abrir = id => $("#" + id).classList.add("abierto");
const cerrar = id => $("#" + id).classList.remove("abierto");

/* ===================== IMÁGENES ===================== */
function figuraSVG(pose) {
  const p = POSES[pose] || POSES.pie;
  const lineas = p.lineas.map(l =>
    `<polyline points="${l.map(q => q.join(",")).join(" ")}" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>`
  ).join("");
  return `<svg viewBox="0 0 120 120" aria-hidden="true">
    <line x1="8" y1="112" x2="112" y2="112" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" opacity=".5"/>
    <circle cx="${p.cabeza[0]}" cy="${p.cabeza[1]}" r="9" fill="currentColor"/>${lineas}</svg>`;
}

const fotos = {}; // ejId -> URL de la foto personal

function miniatura(ejId) {
  const e = EJ[ejId];
  if (!e) return "";
  return `<div class="thumb">${fotos[ejId] ? `<img src="${fotos[ejId]}" alt="">` : figuraSVG(e.pose)}</div>`;
}

// Base de datos para las fotos (IndexedDB). Los blobs no caben bien en localStorage.
let fotoDB = null;
const abrirFotos = () => new Promise((res, rej) => {
  const r = indexedDB.open("miEntrenoFotos", 1);
  r.onupgradeneeded = () => r.result.createObjectStore("fotos");
  r.onsuccess = () => { fotoDB = r.result; res(); };
  r.onerror = () => rej(r.error);
});
const fotoGet = id => new Promise((res, rej) => {
  const q = fotoDB.transaction("fotos").objectStore("fotos").get(id);
  q.onsuccess = () => res(q.result || null);
  q.onerror = () => rej(q.error);
});
const fotoPut = (id, blob) => new Promise((res, rej) => {
  const t = fotoDB.transaction("fotos", "readwrite");
  t.objectStore("fotos").put(blob, id);
  t.oncomplete = () => res();
  t.onerror = () => rej(t.error);
});
const fotoDel = id => new Promise((res, rej) => {
  const t = fotoDB.transaction("fotos", "readwrite");
  t.objectStore("fotos").delete(id);
  t.oncomplete = () => res();
  t.onerror = () => rej(t.error);
});

// Reduce la foto a 800 px como máximo, en JPEG.
function comprimir(file) {
  return createImageBitmap(file).then(bmp => {
    const factor = Math.min(1, 800 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * factor);
    c.height = Math.round(bmp.height * factor);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return new Promise(r => c.toBlob(r, "image/jpeg", 0.85));
  });
}

/* ===================== HOY ===================== */
function itemLinea(it) {
  if (it.ej) {
    return `<li class="fila" data-ver-ej="${it.ej}">${miniatura(it.ej)}
      <div class="txt"><b>${esc(EJ[it.ej].nombre)}</b><br><small>${it.series} × ${esc(it.reps)}</small></div></li>`;
  }
  return `<li class="fila"><div class="txt">${esc(it.texto)}</div></li>`;
}

function renderHoy() {
  const hoy = hoyStr();
  const hechas = new Set(db.sesiones.filter(s => s.fecha === hoy).map(s => s.rutinaId));
  const total = db.rutinas.length;
  const pct = total ? Math.round((hechas.size / total) * 100) : 0;

  $("#resumenHoy").textContent = `${hechas.size} de ${total} rutinas`;
  $("#barraHoy").style.width = pct + "%";

  $("#listaHoy").innerHTML = total ? db.rutinas.map(r => {
    const ok = hechas.has(r.id);
    const conImagen = r.items.filter(i => i.ej);
    return `
    <div class="card ${ok ? "hecha" : ""}">
      <div class="rhead">
        <div><b>${esc(r.nombre)}</b><small>${r.items.length} ejercicios</small></div>
        ${ok
          ? `<button class="btn sm sec" data-deshacer="${r.id}">✓ Hecha</button>`
          : `<button class="btn sm" data-completar="${r.id}">Completar</button>`}
      </div>
      ${conImagen.length ? `<div class="minis-row">${conImagen.map(i =>
        `<div data-ver-ej="${i.ej}" style="cursor:pointer">${miniatura(i.ej)}</div>`).join("")}</div>` : ""}
      <details><summary>Ver lista completa</summary><ul class="lista">${r.items.map(itemLinea).join("")}</ul></details>
    </div>`;
  }).join("") : `<div class="card vacio">Aún no tienes rutinas. Créalas en la pestaña Rutinas.</div>`;
}

function completar(rutinaId) {
  const r = db.rutinas.find(x => x.id === rutinaId);
  if (!r) return;
  db.sesiones.push({ id: uid(), fecha: hoyStr(), rutinaId, rutinaNombre: r.nombre });
  guardar(); renderTodo(); toast("¡Buen trabajo! 💪");
  if (navigator.vibrate) navigator.vibrate(20);
}

function deshacer(rutinaId) {
  const hoy = hoyStr();
  const i = db.sesiones.findIndex(s => s.fecha === hoy && s.rutinaId === rutinaId);
  if (i >= 0) db.sesiones.splice(i, 1);
  guardar(); renderTodo();
}

/* ===================== RUTINAS ===================== */
function renderRutinas() {
  $("#listaRutinas").innerHTML = db.rutinas.length ? db.rutinas.map(r => `
    <div class="card">
      <div class="rhead">
        <div><b>${esc(r.nombre)}</b><small>${r.items.length} ejercicios</small></div>
        <button class="btn sm sec" data-editar="${r.id}">✏️ Editar</button>
      </div>
      <div class="minis-row">${r.items.filter(i => i.ej).map(i =>
        `<div data-ver-ej="${i.ej}" style="cursor:pointer">${miniatura(i.ej)}</div>`).join("")}</div>
    </div>`).join("") : `<div class="card vacio">Aún no tienes rutinas</div>`;
}

function renderBiblioteca() {
  $("#biblioteca").innerHTML = EJERCICIOS.map(e => `
    <button class="ej-card" data-ver-ej="${e.id}">
      ${miniatura(e.id)}
      <b>${esc(e.nombre)}</b>
      <small>${esc(e.grupo)} · ${esc(e.nivel)}</small>
    </button>`).join("");
}

function renderBuilder() {
  $("#bItems").innerHTML = tmpItems.length ? tmpItems.map((it, i) => `
    <li class="fila" style="cursor:default">
      ${it.ej ? miniatura(it.ej) : ""}
      <div class="txt"><b>${esc(it.ej ? EJ[it.ej].nombre : it.texto)}</b>
        ${it.ej ? `<br><small>${it.series} × ${esc(it.reps)}</small>` : ""}</div>
      <button class="x" data-quitar="${i}" aria-label="Quitar">✕</button>
    </li>`).join("") : `<li class="vacio">Aún no agregas ejercicios</li>`;
}

function abrirRutina(id = null) {
  rutinaEditId = id;
  const r = id ? db.rutinas.find(x => x.id === id) : null;
  tmpItems = r ? r.items.map(i => ({ ...i })) : [];
  $("#rTitulo").textContent = r ? "Editar rutina" : "Nueva rutina";
  $("#rNombre").value = r ? r.nombre : "";
  $("#bTexto").value = "";
  $("#rBorrar").hidden = !r;
  renderBuilder();
  abrir("ovRutina");
}

function guardarRutina() {
  const nombre = $("#rNombre").value.trim();
  if (!nombre) return toast("Ponle nombre a la rutina");
  if (!tmpItems.length) return toast("Agrega al menos un ejercicio");

  if (rutinaEditId) {
    const r = db.rutinas.find(x => x.id === rutinaEditId);
    if (r) { r.nombre = nombre; r.items = tmpItems; }
  } else {
    db.rutinas.push({ id: uid(), nombre, items: tmpItems });
  }
  guardar(); cerrar("ovRutina"); renderTodo(); toast("Rutina guardada");
}

function borrarRutina() {
  if (!rutinaEditId || !confirm("¿Eliminar esta rutina? Tu historial se conserva.")) return;
  db.rutinas = db.rutinas.filter(r => r.id !== rutinaEditId);
  guardar(); cerrar("ovRutina"); renderTodo(); toast("Rutina eliminada");
}

/* ===================== FICHA DE EJERCICIO ===================== */
function verEjercicio(id) {
  const e = EJ[id];
  if (!e) return;
  ejActual = id;
  $("#eTitulo").textContent = e.nombre;
  $("#ePreview").innerHTML = fotos[id] ? `<img src="${fotos[id]}" alt="${esc(e.nombre)}">` : figuraSVG(e.pose);
  $("#eInfo").innerHTML = `
    <small style="color:var(--sub)">${esc(e.grupo)} · ${esc(e.nivel)}</small>
    <p style="margin:8px 0 0;font-size:15px;line-height:1.5">${esc(e.como)}</p>
    <p style="margin:10px 0 0;font-size:12px;color:var(--sub)">Si sientes dolor, detente. Consulta a tu médico antes de empezar si tienes alguna condición de salud.</p>`;
  $("#eQuitarFoto").hidden = !fotos[id];
  abrir("ovEjercicio");
}

async function subirFotoEjercicio(file) {
  try {
    const blob = await comprimir(file);
    await fotoPut(ejActual, blob);
    if (fotos[ejActual]) URL.revokeObjectURL(fotos[ejActual]);
    fotos[ejActual] = URL.createObjectURL(blob);
    toast("Foto guardada ✓");
    refrescarImagenes();
    verEjercicio(ejActual);
  } catch (err) {
    toast("No se pudo guardar la foto");
  }
}

async function quitarFotoEjercicio() {
  if (!confirm("¿Quitar tu foto y volver a la ilustración?")) return;
  await fotoDel(ejActual);
  URL.revokeObjectURL(fotos[ejActual]);
  delete fotos[ejActual];
  toast("Foto eliminada");
  refrescarImagenes();
  verEjercicio(ejActual);
}

function refrescarImagenes() {
  renderHoy(); renderRutinas(); renderBiblioteca(); renderBuilder();
}

/* ===================== PROGRESO ===================== */
function renderProgreso() {
  const fechas = new Set(db.sesiones.map(s => s.fecha));
  const ahora = new Date();

  // Racha: días seguidos con al menos una sesión, contando hoy o ayer.
  let racha = 0;
  const d = new Date();
  if (!fechas.has(hoyStr(d))) d.setDate(d.getDate() - 1);
  while (fechas.has(hoyStr(d))) { racha++; d.setDate(d.getDate() - 1); }

  const inicioSemana = new Date(ahora); inicioSemana.setDate(ahora.getDate() - 6);
  const semana = db.sesiones.filter(s => s.fecha >= hoyStr(inicioSemana)).length;

  $("#pRacha").textContent = racha;
  $("#pSemana").textContent = semana;
  $("#pTotal").textContent = db.sesiones.length;

  const conteos = [];
  for (let i = 13; i >= 0; i--) {
    const x = new Date(ahora); x.setDate(ahora.getDate() - i);
    const f = hoyStr(x);
    conteos.push({ etiqueta: x.getDate() + "/" + (x.getMonth() + 1), n: db.sesiones.filter(s => s.fecha === f).length });
  }
  const max = Math.max(1, ...conteos.map(c => c.n));
  $("#grafico").innerHTML = conteos.map(c =>
    `<div style="height:${(c.n / max) * 100}%" title="${c.n} sesión(es)"><span>${c.etiqueta}</span></div>`
  ).join("");

  const recientes = [...db.sesiones].sort((a, b) => b.fecha.localeCompare(a.fecha)).slice(0, 15);
  $("#historial").innerHTML = recientes.length ? recientes.map(s =>
    `<li class="fila" style="cursor:default"><span class="txt">${esc(s.rutinaNombre)}</span><small>${s.fecha}</small></li>`
  ).join("") : `<li class="vacio">Aún no hay sesiones registradas</li>`;
}

/* ===================== AVISOS ===================== */
function renderAvisos() {
  renderPermiso();
  $("#listaAvisos").innerHTML = db.recordatorios.length ? db.recordatorios.map(r => `
    <li class="fila" style="cursor:default">
      <div class="txt">
        <b>${esc(r.hora)}</b> · ${r.dias.map(d => DIAS[d]).join(", ")}<br>
        <small>${esc(r.mensaje || "Hora de entrenar")}</small>
      </div>
      <label class="sw"><input type="checkbox" data-toggle="${r.id}" ${r.activo ? "checked" : ""}><span></span></label>
      <button class="x" data-borrar-aviso="${r.id}" aria-label="Eliminar">🗑️</button>
    </li>`).join("") : `<li class="vacio">Sin recordatorios</li>`;
}

function renderPermiso() {
  const texto = !("Notification" in window) ? "Tu navegador no soporta notificaciones."
    : Notification.permission === "granted" ? "Activados ✓"
    : Notification.permission === "denied" ? "Bloqueados. Actívalos en los ajustes del navegador o del teléfono."
    : "Sin activar. Pulsa el botón para permitirlos.";
  $("#estadoPerm").textContent = texto;
}

function crearAviso() {
  const dias = [...document.querySelectorAll("#aDias input:checked")].map(i => Number(i.value));
  const hora = $("#aHora").value;
  if (!hora) return toast("Elige la hora");
  if (!dias.length) return toast("Elige al menos un día");

  const ahora = new Date();
  const [h, m] = hora.split(":").map(Number);
  const yaPaso = ahora.getHours() * 60 + ahora.getMinutes() >= h * 60 + m;
  const ultimoAviso = yaPaso && dias.includes(ahora.getDay()) ? hoyStr() : "";

  db.recordatorios.push({ id: uid(), hora, dias, activo: true, ultimoAviso, mensaje: $("#aMensaje").value.trim() });
  guardar();
  $("#aMensaje").value = "";
  document.querySelectorAll("#aDias input").forEach(i => i.checked = false);
  renderAvisos(); toast("Recordatorio creado ✓");
}

async function notificar(titulo, cuerpo) {
  toast(titulo + (cuerpo ? " · " + cuerpo : ""));
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  const opciones = { body: cuerpo, tag: "mi-entreno", renotify: true, vibrate: [200, 100, 200] };
  const reg = await navigator.serviceWorker?.getRegistration();
  if (reg) reg.showNotification(titulo, opciones);
  else new Notification(titulo, opciones);
}

// Revisa cada 30 s si toca algún recordatorio (solo con la app abierta).
function revisarRecordatorios() {
  const ahora = new Date();
  const hoy = hoyStr(ahora);
  const dia = ahora.getDay();
  const minutos = ahora.getHours() * 60 + ahora.getMinutes();
  let cambio = false;

  db.recordatorios.forEach(r => {
    if (!r.activo || !r.dias.includes(dia) || r.ultimoAviso === hoy) return;
    const [h, m] = r.hora.split(":").map(Number);
    const objetivo = h * 60 + m;
    if (minutos >= objetivo && minutos - objetivo <= 180) {
      r.ultimoAviso = hoy;
      cambio = true;
      notificar("Hora de entrenar 💪", r.mensaje || "Es momento de tu rutina");
    }
  });
  if (cambio) guardar();
}

/* ===================== RENDER GENERAL ===================== */
function renderTodo() {
  renderHoy(); renderRutinas(); renderProgreso(); renderAvisos();
}

/* ===================== EVENTOS ===================== */
function configurarEventos() {
  document.querySelectorAll("nav.bottom button").forEach(b => b.onclick = () => {
    document.querySelectorAll("nav.bottom button").forEach(x => x.classList.toggle("on", x === b));
    document.querySelectorAll(".vista").forEach(v => v.classList.toggle("activa", v.id === b.dataset.vista));
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  document.querySelectorAll("[data-cerrar]").forEach(b => b.onclick = () => cerrar(b.dataset.cerrar));
  document.querySelectorAll(".overlay").forEach(o => o.addEventListener("click", e => {
    if (e.target === o) cerrar(o.id);
  }));

  // Abrir ficha de ejercicio desde cualquier miniatura o tarjeta
  document.addEventListener("click", e => {
    const v = e.target.closest("[data-ver-ej]");
    if (v) verEjercicio(v.dataset.verEj);
  });

  $("#listaHoy").onclick = e => {
    const c = e.target.closest("[data-completar]");
    const d = e.target.closest("[data-deshacer]");
    if (c) completar(c.dataset.completar);
    if (d) deshacer(d.dataset.deshacer);
  };

  $("#btnNuevaRutina").onclick = () => abrirRutina();
  $("#listaRutinas").onclick = e => {
    const b = e.target.closest("[data-editar]");
    if (b) abrirRutina(b.dataset.editar);
  };

  // Constructor de rutinas
  $("#bEj").innerHTML = `<option value="">— Ejercicio —</option>` +
    EJERCICIOS.map(e => `<option value="${e.id}">${esc(e.nombre)}</option>`).join("");
  $("#bAgregar").onclick = () => {
    const ej = $("#bEj").value;
    if (!ej) return toast("Elige un ejercicio");
    tmpItems.push({ ej, series: parseInt($("#bSeries").value) || 3, reps: $("#bReps").value.trim() || "10" });
    renderBuilder();
  };
  $("#bLibre").onclick = () => {
    const t = $("#bTexto").value.trim();
    if (!t) return toast("Escribe el ejercicio");
    tmpItems.push({ texto: t });
    $("#bTexto").value = "";
    renderBuilder();
  };
  $("#bItems").onclick = e => {
    const q = e.target.closest("[data-quitar]");
    if (q) { tmpItems.splice(Number(q.dataset.quitar), 1); renderBuilder(); }
  };
  $("#rGuardar").onclick = guardarRutina;
  $("#rBorrar").onclick = borrarRutina;

  // Ficha de ejercicio: subir o quitar foto propia
  $("#eSubir").onclick = () => $("#eFile").click();
  $("#eFile").onchange = e => {
    const f = e.target.files[0];
    e.target.value = "";
    if (f) subirFotoEjercicio(f);
  };
  $("#eQuitarFoto").onclick = quitarFotoEjercicio;

  // Avisos
  $("#btnPermiso").onclick = () => {
    if (!("Notification" in window)) return toast("Tu navegador no soporta notificaciones");
    Notification.requestPermission().then(() => { renderPermiso(); toast("Permisos actualizados"); });
  };
  $("#btnPrueba").onclick = () => {
    if (!("Notification" in window) || Notification.permission !== "granted")
      return toast("Primero activa los avisos");
    notificar("Mi Entreno 💪", "Así se verán tus recordatorios");
  };
  $("#aDias").innerHTML = DIAS.map((d, i) =>
    `<label><input type="checkbox" value="${i}" ${i >= 1 && i <= 5 ? "checked" : ""}>${d}</label>`
  ).join("");
  $("#btnGuardarAviso").onclick = crearAviso;
  $("#listaAvisos").onclick = e => {
    const b = e.target.closest("[data-borrar-aviso]");
    if (b && confirm("¿Eliminar este recordatorio?")) {
      db.recordatorios = db.recordatorios.filter(r => r.id !== b.dataset.borrarAviso);
      guardar(); renderAvisos();
    }
  };
  $("#listaAvisos").onchange = e => {
    const t = e.target.closest("[data-toggle]");
    if (!t) return;
    const r = db.recordatorios.find(x => x.id === t.dataset.toggle);
    if (r) { r.activo = t.checked; guardar(); }
  };
}

/* ===================== INICIO ===================== */
document.addEventListener("DOMContentLoaded", async () => {
  $("#fechaHoy").textContent = new Date().toLocaleDateString("es-EC", { weekday: "long", day: "numeric", month: "long" });

  try {
    await abrirFotos();
    for (const e of EJERCICIOS) {
      const blob = await fotoGet(e.id).catch(() => null);
      if (blob) fotos[e.id] = URL.createObjectURL(blob);
    }
  } catch {
    // Si no hay IndexedDB, la app sigue funcionando con las ilustraciones.
  }

  guardar(); // guarda las rutinas de ejemplo o la migración la primera vez
  configurarEventos();
  renderBiblioteca();
  renderTodo();

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

  revisarRecordatorios();
  setInterval(revisarRecordatorios, 30000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) revisarRecordatorios(); });
});
</script>
</body>
</html>
